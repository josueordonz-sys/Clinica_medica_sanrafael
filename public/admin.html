<!DOCTYPE html>
<html lang="es" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../src/assets/logo.png">
  <title>SIREC - Clínica Médica San Rafael</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.0/css/bulma.min.css">
  <link rel="stylesheet" href="../src/assets/estilos.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
  <!-- Chart.js link de dashboard no olvidar Erling -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
  <!-- Sidebar Navigation -->
  <aside class="app-sidebar">
    <div class="sidebar-logo">
      <svg viewBox="0 0 24 24">
        <img src="../src/assets/logo.png" alt="logo" style="width: 32px; height: 32px;">
      </svg>
      <div class="logo-text">
        <span class="logo-title">San Rafael</span>
        <span class="logo-subtitle">SIREC Portal</span>
      </div>
    </div>

    <nav class="sidebar-nav">

      <div class="nav-link" data-target="view-dashboard">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="3" width="7" height="9" />
          <rect x="14" y="3" width="7" height="5" />
          <rect x="14" y="12" width="7" height="9" />
          <rect x="3" y="16" width="7" height="5" />
        </svg>
        Dashboard
      </div>

      <div class="nav-link active" data-target="view-pacientes">
        <svg viewBox="0 0 24 24">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
          <circle cx="9" cy="7" r="4" />
          <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
          <path d="M16 3.13a4 4 0 0 1 0 7.75" />
        </svg>
        Pacientes
      </div>

      <div class="nav-link" data-target="view-citas">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
          <line x1="16" y1="2" x2="16" y2="6" />
          <line x1="8" y1="2" x2="8" y2="6" />
          <line x1="3" y1="10" x2="21" y2="10" />
        </svg>
        Citas
      </div>

      <div class="nav-link" data-target="view-triaje">
        <svg viewBox="0 0 24 24">
          <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
        </svg>
        Triaje
        <span class="nav-badge" id="triage-badge" style="display: none;">0</span>
      </div>

      <div class="nav-link" data-target="view-medico">
        <svg viewBox="0 0 24 24">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
          <polyline points="14 2 14 8 20 8" />
          <line x1="16" y1="13" x2="8" y2="13" />
          <line x1="16" y1="17" x2="8" y2="17" />
          <polyline points="10 9 9 9 8 9" />
        </svg>
        Consulta Médica
      </div>

      <div class="nav-link" data-target="view-caja">
        <svg viewBox="0 0 24 24">
          <rect x="1" y="4" width="22" height="16" rx="2" ry="2" />
          <line x1="1" y1="10" x2="23" y2="10" />
        </svg>
        Facturación y Cobros
      </div>
      <div class="nav-link" data-target="view-inventario">
        <svg viewBox="0 0 24 24">
          <path
            d="M21 8a2 2 0 0 0-1-1.73L13 2.27a2 2 0 0 0-2 0L4 6.27A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z" />
          <path d="M3.3 7 12 12l8.7-5" />
          <path d="M12 22V12" />
        </svg>
        Inventario
      </div>
      <div class="nav-dropdown-container" data-module="seguridad" style="display:none;">
        <div class="nav-link nav-dropdown-toggle" id="seguridad-dropdown-toggle">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          Seguridad
          <svg class="dropdown-arrow" viewBox="0 0 24 24" width="16" height="16" style="margin-left: auto;">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </div>
        <div class="nav-dropdown-items" id="seguridad-dropdown-items" style="display:none;">
          <div class="nav-link nav-sub-link" data-target="view-usuarios">Usuarios</div>
          <div class="nav-link nav-sub-link" data-target="view-roles">Roles</div>
          <!-- <div class="nav-link nav-sub-link" data-target="view-objetos">Objetos (Pantallas)</div> -->
          <div class="nav-link nav-sub-link" data-target="view-permisos">Permisos</div>
        </div>
      </div>
    </nav>

    <div class="sidebar-footer">
      <div class="role-widget">
        <label>Sesión Activa:</label>
        <button id="btn-logout" class="btn btn-secondary btn-small" style="width:100%; margin-top:8px;">Cerrar
          Sesión</button>
      </div>
    </div>
  </aside>



  <!-- Main Application Body -->
  <main class="app-body">

    <!-- Top App Header -->
    <header class="app-header">
      <div class="header-search">
        <svg viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <input type="text" id="global-dni-search" placeholder="Buscar DNI rápido para validar...">
      </div>

      <div class="header-actions">

        <button class="theme-toggle" id="theme-btn" title="Cambiar tema">
          <svg id="theme-icon" viewBox="0 0 24 24">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
        </button>

        <button class="theme-toggle voice-toggle" id="voice-btn" title="Activar voz de lectura" aria-pressed="false">
          <svg id="voice-icon" viewBox="0 0 24 24">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
          </svg>
        </button>

        <div class="user-profile">
          <div class="user-avatar" id="avatar-letters">AD</div>
          <div class="user-info">
            <span class="user-name" id="profile-name">Admin SIREC</span>
            <span class="user-role" id="profile-role">Administrador</span>
          </div>
        </div>
      </div>
    </header>

    <!-- Global Alert Notifications -->
    <div id="alert-container"></div>

    <!-- Modular Views -->

    <!-- PANTALLA 1: PANEL DE CONTROL ADMINISTRATIVO (DASHBOARD) -->
    <section id="view-dashboard" class="app-view" style="display: none;">
    </section>

    <!-- PANTALLA 1: GESTIÓN DE USUARIOS (Solo Administrador - last update) -->
    <section id="view-usuarios" class="app-view" style="display: none;">
    </section>

    <!-- SUB-PANTALLAS SEGURIDAD -->
    <section id="view-roles" class="app-view" style="display: none;"></section>
    <section id="view-objetos" class="app-view" style="display: none;"></section>
    <section id="view-permisos" class="app-view" style="display: none;"></section>

    <!-- PANTALLA 2: REGISTRO ÚNICO DE PACIENTES -->
    <section id="view-pacientes" class="app-view">
    </section>

    <!-- PANTALLA 3: AGENDA DE CITAS -->
    <section id="view-citas" class="app-view" style="display: none;">
    </section>

    <!-- PANTALLA 4: GESTIÓN DE CAJA -->
    <section id="view-caja" class="app-view" style="display: none;">
    </section>

    <!-- PANTALLA 5: MONITOR DE TRIAJE Y SIGNOS VITALES -->
    <section id="view-triaje" class="app-view" style="display: none;">
    </section>

    <!-- PANTALLA 6: CONSULTORIO MÉDICO Y EXPEDIENTE DIGITAL -->
    <section id="view-medico" class="app-view" style="display: none;">
    </section>

    <!-- PANTALLA 7: INVENTARIO DE MEDICAMENTOS -->
    <section id="view-inventario" class="app-view" style="display: none;">
    </section>


  </main>

  <!-- MODALS -->
  
  <div class="modal-overlay" id="modal-ticket">
    <div class="modal-content" style="max-width: 800px; padding: 20px; max-height: 90vh; overflow-y: auto;">
      <div class="ticket-print" id="ticket-print-content" style="background: white; color: black;"></div>
      <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 20px;">
        <button class="btn btn-secondary"
          onclick="document.getElementById('modal-ticket').style.display='none'">Cerrar</button>
        <button class="btn btn-primary" onclick="window.printDocument(true)">Imprimir Factura</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-receta">
    <div class="modal-content" style="max-width: 800px; max-height: 90vh; overflow-y: auto;">
      <div class="glass-card"
        style="border: 1px dashed var(--border-color); background: #fff; color: #000; padding: 24px;"
        id="receta-print-content"></div>
      <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 20px;">
        <button class="btn btn-secondary"
          onclick="document.getElementById('modal-receta').style.display='none'">Cerrar</button>
        <button class="btn btn-primary" onclick="window.printDocument(false)">Imprimir / Guardar PDF</button>
      </div>
    </div>
  </div>

  <!-- Entry Script Modular -->
  <script type="module" src="../src/main.js?v=2"></script>
</body>

</html>
