<div class="glass-card" style="margin-bottom: 24px; padding: 20px 24px; border-top: 4px solid var(--primary, #0077b6);">
  <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;">
    <div>
      <h2 style="font-size: 1.4rem; font-weight: 700; margin: 0;">Gestión de Roles</h2>
    </div>
    <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
      <input type="text" id="search-roles" class="form-input" placeholder="Buscar por nombre..." style="min-width: 250px;">
      <button id="btn-add-rol" class="btn btn-primary" style="display:flex; gap:8px; align-items:center;">
        + Nuevo Rol
      </button>
    </div>
  </div>
</div>

<div class="glass-card" style="padding: 0; overflow: hidden;">
  <div class="table-container" style="overflow-x: auto;">
    <table class="table is-fullwidth is-hoverable is-striped" style="margin-bottom: 0;">
      <thead style="background: var(--dark, #1f2937); color: #fff;">
        <tr>
          <th style="color: #fff;">Nombre</th>
          <th style="color: #fff;">Nivel</th>
          <th style="color: #fff;">Descripción</th>
          <th style="color: #fff;" class="has-text-centered">Nº Usuarios</th>
          <th style="color: #fff;" class="has-text-centered">Acciones</th>
        </tr>
      </thead>
      <tbody id="roles-table-body">
        <!-- Roles render here -->
      </tbody>
    </table>
  </div>
</div>

<!-- Modal: Crear/Editar Rol -->
<div id="modal-rol-form" class="modal-overlay" style="display:none;">
  <div class="glass-card" style="width: 440px; max-width: 92%; background: var(--bg-secondary);">
    <div class="card-header-flex" style="margin-bottom: 20px;">
      <h3 class="card-title">
        <span id="modal-rol-title">Crear Nuevo Rol</span>
      </h3>
      <button type="button" class="btn-close-modal" style="background:none;border:none;font-size:1.6rem;cursor:pointer;color:var(--text-muted);">&times;</button>
    </div>
    <form id="form-create-rol">
      <input type="hidden" id="edit-rol-id" value="">
      
      <div class="form-group" style="margin-bottom: 16px;">
        <label class="form-label" for="rol-nombre">Nombre del Rol <span class="required">*</span></label>
        <input type="text" id="rol-nombre" class="form-input" placeholder="Ej. Administrador" required>
      </div>

      <div class="form-group" style="margin-bottom: 16px;">
        <label class="form-label" for="rol-nivel">Nivel de Jerarquía <span class="required">*</span></label>
        <input type="number" id="rol-nivel" class="form-input" placeholder="1 = Más alto" min="1" max="99" required>
        <small style="color:var(--text-muted); font-size:0.75rem;">Un nivel menor indica mayor prioridad.</small>
      </div>

      <div class="form-group" style="margin-bottom: 24px;">
        <label class="form-label" for="rol-desc">Descripción</label>
        <textarea id="rol-desc" class="form-input" rows="2" placeholder="Breve descripción del propósito de este rol"></textarea>
      </div>

      <div class="form-group" style="margin-bottom: 24px;">
        <label class="form-label">Permisos de Pantallas</label>
        <div id="rol-permisos-container" style="background: var(--bg-primary, #ffffff); border: 1px solid var(--border-color, #e5e7eb); border-radius: 8px; padding: 12px; max-height: 180px; overflow-y: auto;">
          <!-- Checkboxes se cargarán aquí dinámicamente -->
          <div style="color: var(--text-muted); font-size: 0.85rem; text-align: center;">Cargando pantallas...</div>
        </div>
      </div>

      <div id="rol-form-error" style="display:none; padding: 10px 14px; margin-bottom:16px; border-radius:8px; background: var(--danger-light, #fee2e2); color: var(--danger, #dc2626); font-size:0.85rem;"></div>
      
      <div style="display:flex; justify-content:flex-end; gap:12px;">
        <button type="button" class="btn btn-secondary btn-close-modal">Cancelar</button>
        <button type="submit" id="btn-submit-rol" class="btn btn-primary">Guardar Rol</button>
      </div>
    </form>
  </div>
</div>
