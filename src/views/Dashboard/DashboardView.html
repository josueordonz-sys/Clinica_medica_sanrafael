<div class="glass-card" style="margin-bottom: 24px; padding: 16px;">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;">

            <label class="form-label" style="margin-bottom:0;" for="dash-fecha-inicio">Desde:</label>
            <input type="date" id="dash-fecha-inicio" class="form-input" style="padding: 6px 12px; width: auto;">
            <label class="form-label" style="margin-bottom:0;" for="dash-fecha-fin">Hasta:</label>
            <input type="date" id="dash-fecha-fin" class="form-input" style="padding: 6px 12px; width: auto;">

          </div>
          <div style="display: flex; gap: 8px;">
            <button class="btn btn-secondary btn-small" id="btn-dash-export-excel" title="Exportar Excel"><span class="material-symbols-outlined" style="font-size: 20px;">table_view</span></button>
            <button class="btn btn-primary btn-small" id="btn-dash-export-pdf" title="Exportar PDF"><span class="material-symbols-outlined" style="font-size: 20px;">picture_as_pdf</span></button>
          </div>
        </div>
      </div>

            <span class="stat-label">Ingresos de Hoy</span>

          </div>
          <div class="stat-icon success">
            <svg viewBox="0 0 24 24">

              <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />

          </div>
        </div>

        <div class="stat-card">

          </div>

            <svg viewBox="0 0 24 24">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
              <circle cx="9" cy="7" r="4" />
              <path d="M22 21v-2a4 4 0 0 0-3-3.87" />

        <div class="stat-card">

              <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />

          </div>
        </div>

      <div class="charts-grid" style="margin-bottom: 24px;">
        <div class="glass-card">
          <div class="card-header-flex">
            <h3 class="card-title">Comparativo Semanal</h3>
          </div>
          <div class="chart-container">
            <canvas id="chart-semanal"></canvas>
          </div>
        </div>

        <div class="glass-card">
          <div class="card-header-flex">
            <h3 class="card-title">Ingresos por Especialidad</h3>
          </div>

          </div>
        </div>
