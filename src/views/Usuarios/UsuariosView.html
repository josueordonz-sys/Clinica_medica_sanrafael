<div class="glass-card" style="margin-bottom: 24px; padding: 20px 24px;">
  <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;">
    <div>
      <h2 style="font-size: 1.4rem; font-weight: 700; margin: 0;">
        Gestión de Usuarios del Sistema
      </h2>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin: 4px 0 0;">
        Solo el Administrador puede crear y ver usuarios del sistema.
      </p>
    </div>
    <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
      <select id="filter-role-usuarios" class="form-input" style="min-width: 150px;">
        <option value="Todos">Todos</option>
        <option value="Administrador">Administrador</option>
        <option value="Medico">Médico</option>
        <option value="Enfermeria">Triaje</option>
        <option value="Recepcionista">Recepción / Caja</option>
      </select>
      <input type="text" id="search-usuarios" class="form-input" placeholder="Buscar por nombre o rol..."
        style="min-width: 250px;">
      <button id="btn-add-usuario" class="btn btn-primary" style="display:flex; gap:8px; align-items:center;">
        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" fill="none" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Nuevo Usuario
      </button>
    </div>
  </div>
</div>

<div id="usuarios-grid" style="display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));">
  <!-- Las tarjetas de usuario se renderizarán aquí -->
</div>

<!-- Modal: Crear Nuevo Usuario -->
<div id="modal-user-form" class="modal-overlay" style="display:none;">
  <div class="glass-card" style="width: 440px; max-width: 92%; background: var(--bg-secondary); max-height: 90vh; overflow-y: auto;">
    <div class="card-header-flex" style="margin-bottom: 20px;">
      <h3 class="card-title">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" fill="none" stroke-width="2"
          style="margin-right:8px;vertical-align:middle;">
          <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="8.5" cy="7" r="4"></circle>
          <line x1="20" y1="8" x2="20" y2="14"></line>
          <line x1="23" y1="11" x2="17" y2="11"></line>
        </svg>
        <span id="modal-user-title">Crear Nuevo Usuario</span>
      </h3>
      <button type="button" class="btn-close-modal"
        style="background:none;border:none;font-size:1.6rem;cursor:pointer;color:var(--text-muted);line-height:1;">&times;</button>
    </div>
    <form id="form-create-user">
      <input type="hidden" id="edit-user-id" value="">
      <div class="form-group" style="margin-bottom: 16px;">
        <label class="form-label" for="new-user-dni">DNI <span class="required">*</span></label>
        <input type="text" id="new-user-dni" class="form-input" placeholder="Ej. 0801-1990-12345" required>
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px;">
        <div class="form-group">
          <label class="form-label" for="new-user-pnom">Primer Nombre <span class="required">*</span></label>
          <input type="text" id="new-user-pnom" class="form-input" placeholder="Ej. Karla" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="new-user-snom">Segundo Nombre</label>
          <input type="text" id="new-user-snom" class="form-input" placeholder="Opcional">
        </div>
        <div class="form-group">
          <label class="form-label" for="new-user-pape">Primer Apellido <span class="required">*</span></label>
          <input type="text" id="new-user-pape" class="form-input" placeholder="Ej. Paz" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="new-user-sape">Segundo Apellido</label>
          <input type="text" id="new-user-sape" class="form-input" placeholder="Opcional">
        </div>
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px;">
        <div class="form-group">
          <label class="form-label" for="new-user-email">Correo Electrónico</label>
          <input type="email" id="new-user-email" class="form-input" placeholder="correo@clinica.hn" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="new-user-tel">Teléfono</label>
          <input type="text" id="new-user-tel" class="form-input" placeholder="Ej. 9999-0000">
        </div>
      </div>
      <div class="form-group" style="margin-bottom: 16px;">
        <label class="form-label" for="new-user-password">Contraseña <span id="password-req-star" class="required">*</span></label>
        <input type="password" id="new-user-password" class="form-input" placeholder="Mínimo 6 caracteres" required minlength="6">
        <small id="password-help-text" style="display:none; color:var(--text-muted); font-size:0.75rem; margin-top:4px;">Dejar en blanco para mantener la actual.</small>
      </div>
      <div class="form-group" style="margin-bottom: 24px;">
        <label class="form-label" for="new-user-role">Rol del Sistema</label>
        <select id="new-user-role" class="form-input" required>
          <option value="Administrador">Administrador</option>
          <option value="Recepcionista">Recepción / Caja</option>
          <option value="Enfermeria">Triaje</option>
          <option value="Medico">Consulta Médica</option>
        </select>
      </div>
      <div id="contenedor-especialidad" class="form-group" style="margin-bottom: 24px; display: none;">
        <label class="form-label" for="usuario-especialidad">Especialidad (Solo Médicos) <span
            class="required">*</span></label>
        <input type="text" id="usuario-especialidad" class="form-input"
          placeholder="Escriba o seleccione una especialidad" list="lista-especialidades">
        <datalist id="lista-especialidades">
        </datalist>
      </div>
      <div id="contenedor-foto" class="form-group" style="margin-bottom: 24px; display: none;">
        <label class="form-label">Foto del Médico (Para mostrar en la página principal)</label>
        <div style="display: flex; align-items: center; gap: 16px;">
          <div style="width: 80px; height: 80px; border-radius: 50%; overflow: hidden; background: var(--bg-tertiary); border: 2px solid var(--border-color); flex-shrink: 0;">
            <img id="foto-preview" src="" style="width: 100%; height: 100%; object-fit: cover; display: none;">
            <svg id="foto-placeholder" viewBox="0 0 24 24" style="width: 100%; height: 100%; padding: 16px; color: var(--text-muted); fill: currentColor;">
              <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
          </div>
          <div style="flex-grow: 1;">
            <input type="file" id="foto-medico" class="form-input" accept="image/*" style="padding: 8px;">
            <small style="color: var(--text-muted); display: block; margin-top: 4px;">Seleccione una imagen cuadrada (JPG, PNG).</small>
          </div>
        </div>
      </div>
      <div id="contenedor-firma" class="form-group" style="margin-bottom: 24px; display: none;">
        <label class="form-label">Firma del Médico</label>
        <div style="border: 1px solid var(--border-color); border-radius: 8px; background: #fff; overflow: hidden; margin-bottom: 8px;">
          <canvas id="firma-canvas" width="400" height="150" style="width: 100%; height: 150px; display: block; cursor: crosshair; touch-action: none;"></canvas>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <small style="color: var(--text-muted);">Dibuje su firma en el recuadro superior.</small>
          <button type="button" id="btn-limpiar-firma" class="btn btn-secondary" style="padding: 4px 10px; font-size: 0.8rem;">Limpiar Firma</button>
        </div>
      </div>
      <div id="user-form-error"
        style="display:none; padding: 10px 14px; margin-bottom:16px; border-radius:8px; background: var(--danger-light, #fee2e2); color: var(--danger, #dc2626); font-size:0.85rem;">
      </div>
      <div style="display:flex; justify-content:flex-end; gap:12px;">
        <button type="button" class="btn btn-secondary btn-close-modal">Cancelar</button>
        <button type="submit" id="btn-submit-user" class="btn btn-primary">Crear Usuario</button>
      </div>
    </form>
  </div>
</div>
</body>
