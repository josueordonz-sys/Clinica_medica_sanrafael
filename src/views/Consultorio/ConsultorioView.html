<div class="glass-card">
        <div class="card-header-flex">
          <h2 class="card-title">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" fill="none" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
              <polyline points="14 2 14 8 20 8" />
              <line x1="16" y1="13" x2="8" y2="13" />
              <line x1="16" y1="17" x2="8" y2="17" />
              <polyline points="10 9 9 9 8 9" />
            </svg>
            Consultorio Médico y Expediente Digital
          </h2>
          <span style="font-size: 0.85rem; color: var(--text-muted);">Módulo: Médico Especialista</span>
        </div>

        <div class="consultation-layout">
          <!-- Columna Izquierda: Cola del Médico -->
          <div>
            <h3 style="font-size: 0.95rem; margin-bottom: 12px; font-weight: 700;">Cola de Espera Médica</h3>
            <div class="patient-selector-list" id="medico-cola-pacientes">
              <!-- Dinámico -->
            </div>
          </div>

          <!-- Columna Derecha: Expediente e Historial -->
          <div>
            <div id="medico-form-container" style="display: none;">
              <div class="vitals-meter-grid" id="medico-vitals-resumen" style="margin-bottom: 24px;">
                <!-- Dinámico -->
              </div>

              <div class="glass-card" style="margin-bottom: 24px; padding: 16px; background-color: var(--bg-primary);">
                <h3 style="font-size: 1rem; margin-bottom: 12px; font-weight: 700;">Historial Clínico</h3>
                <div id="medico-historial-clinico"
                  style="max-height: 180px; overflow-y: auto; font-size: 0.85rem; display: flex; flex-direction: column; gap: 8px;">
                  <!-- Dinámico -->
                </div>
              </div>

              <form id="form-consulta-medica">
                <div class="form-grid">
                  <div class="form-group col-span-2">
                    <label class="form-label" for="medico-motivo">Motivo de Consulta <span
                        class="required">*</span></label>
                    <input type="text" id="medico-motivo" class="form-input" placeholder="Ej. Dolor de pecho" required>
                  </div>
                  <div class="form-group col-span-2">
                    <label class="form-label" for="medico-diagnostico">Diagnóstico (CIE-10) <span
                        class="required">*</span></label>
                    <input type="text" id="medico-diagnostico" class="form-input" placeholder="CIE-10..." required
                      list="cie10-list">
                    <datalist id="cie10-list">
                      <option value="I10 - Hipertensión esencial (primaria)">
                      <option value="E11 - Diabetes mellitus tipo 2">
                      <option value="J06.9 - Infección aguda de las vías respiratorias superiores">
                      <option value="K21.9 - Reflujo gastroesofágico">
                      <option value="N39.0 - Infección urinaria">
                    </datalist>
                  </div>
                  <div class="form-group col-span-2">
                    <label class="form-label" for="medico-sintomatologia">Sintomatología</label>
                    <textarea id="medico-sintomatologia" class="form-textarea" rows="2"
                      placeholder="Síntomas..."></textarea>
                  </div>
                  <div class="form-group col-span-2">
                    <label class="form-label" for="medico-antecedentes">Antecedentes</label>
                    <input type="text" id="medico-antecedentes" class="form-input"
                      placeholder="Antecedentes médicos...">
                  </div>
                </div>

                <!-- Receta Médica -->
                <div class="recipe-builder">
                  <h4 style="font-size: 0.9rem; font-weight: 700; color: var(--text-secondary); margin-bottom: 8px;">
                    Receta Médica Digital</h4>

                  <div
                    style="display: grid; grid-template-columns: 2fr .8fr 1fr 1fr 1fr auto; gap: 8px; align-items: end;">
                    <div class="form-group">
                      <label class="form-label" style="font-size: 0.75rem;"
                        for="add-receta-medicamento">Medicamento</label>
                      <select id="add-receta-medicamento" class="form-input">
                        <option value="" disabled selected>Seleccione medicamento</option>
                      </select>
                    </div>
                    <div class="form-group">
                      <label class="form-label" style="font-size: 0.75rem;" for="add-receta-cantidad">Cantidad</label>
                      <input type="number" id="add-receta-cantidad" class="form-input" min="1" value="1">
                    </div>
                    <div class="form-group">
                      <label class="form-label" style="font-size: 0.75rem;">Dosis / Frecuencia</label>
                      <input type="text" id="add-receta-dosis" class="form-input" placeholder="Ej. 1 tab c/12h">
                    </div>
                    <div class="form-group">
                      <label class="form-label" style="font-size: 0.75rem;">Duración (Días)</label>
                      <input type="number" id="add-receta-duracion" class="form-input" min="1" placeholder="Días">
                    </div>
                    <div class="form-group">
                      <label class="form-label" style="font-size: 0.75rem;">Expira (Auto)</label>
                      <input type="text" id="add-receta-expira" class="form-input" readonly placeholder="Auto">
                    </div>
                    <button type="button" class="btn btn-primary" id="btn-agregar-medicamento"
                      style="padding: 10px 14px;">+</button>
                  </div>

                  <div class="table-container" style="margin-top: 10px;">
                    <table class="app-table" id="tabla-medicamentos-receta" style="font-size: 0.8rem;">
                      <thead>
                        <tr>
                          <th>Fármaco</th>
                          <th>Cantidad</th>
                          <th>Precio</th>
                          <th>Dosis / Frecuencia</th>
                          <th>Duración</th>
                          <th>Expira</th>
                          <th>Acciones</th>
                        </tr>
                      </thead>
                      <tbody>
                        <!-- Dinámico -->
                      </tbody>
                    </table>
                  </div>
                </div>

                <div class="form-grid">
                  <div class="form-group col-span-2">
                    <label class="form-label" for="medico-tratamiento">Tratamiento General</label>
                    <textarea id="medico-tratamiento" class="form-textarea" rows="2"
                      placeholder="Recomendaciones..."></textarea>
                  </div>
                  <div class="form-group">
                    <label class="form-label">Exámenes de Laboratorio</label>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px;">
                      <label><input type="checkbox" class="exam-check" value="Hemograma Completo"> Hemograma</label>
                      <label><input type="checkbox" class="exam-check" value="Glucosa en Ayunas"> Glucosa</label>
                      <label><input type="checkbox" class="exam-check" value="Perfil Lipídico"> P. Lipídico</label>
                      <label><input type="checkbox" class="exam-check" value="Examen de Orina"> Ex. Orina</label>
                    </div>
                  </div>
                  <div class="form-group">
                    <label class="form-label" for="medico-privadas">Notas Privadas</label>
                    <input type="text" id="medico-privadas" class="form-input" placeholder="Privado...">
                  </div>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px;">

                  <button type="submit" class="btn btn-success" data-perm-action="insertar">Finalizar Consulta</button>
                </div>
              </form>
            </div>

            <div id="medico-sin-seleccion" style="padding: 40px; text-align: center; color: var(--text-muted);">
              <svg viewBox="0 0 24 24" width="48" height="48" stroke="currentColor" fill="none" stroke-width="2"
                style="margin-bottom: 12px; opacity: 0.5;">
                <circle cx="12" cy="12" r="10" />
                <path d="M12 8v4" />
                <path d="M12 16h.01" />
              </svg>
              <p>Seleccione un paciente de la cola para ver expediente.</p>
            </div>
          </div>
        </div>
      </div>
</body>
